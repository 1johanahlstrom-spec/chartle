name: Tester

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Testsvit
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: ./tests/run.sh
      - name: Syntax och Compose-konfiguration
        run: |
          python -m compileall -q server pipeline tests
          node --check docs/game.js
          node --check docs/app.js
          node --check docs/pwa.js
          node --check docs/service-worker.js
          node --check tests/test_e2e.js
          docker compose config --quiet

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: docker compose up -d --build
      - name: Vänta på tjänsterna
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8137/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm run test:e2e
      - if: always()
        run: docker compose logs
